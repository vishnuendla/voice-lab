[project]
name = "voice-assistant"
version = "0.4.0"
description = "Browser voice lab: Pipecat + Sarvam STT/TTS + Groq LLM (OpenRouter failover)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Used by ai/chat.py (session summaries) against any OpenAI-compatible
    # provider, and by pipecat's own OpenAI-compatible services.
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.scripts]
voice-desktop = "voice_assistant.desktop.cli:main"
voice-pipecat = "voice_assistant.pipecat.bot:run"
voice-telephony = "voice_assistant.telephony.server:main"
voice-web = "voice_assistant.web.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
pipecat = [
    "pipecat-ai[websocket,silero,piper,sarvam,whisper,groq,openrouter]>=0.0.50",
]
# Local mic/speaker transport (bot.py, scripts/test_piper.py). Needs a C
# compiler + portaudio headers for pyaudio, so it is opt-in:
#   uv sync --group local
local = [
    "pipecat-ai[local]>=0.0.50",
]
# Legacy push-to-talk desktop CLI (desktop/, agent/, adapters/). Nothing on the
# browser or phone path imports these, so they stay out of the base install:
#   uv sync --group desktop
desktop = [
    "tavily-python>=0.5.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.29.0",
]
telephony = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "requests>=2.31.0",
]

[tool.uv]
default-groups = ["pipecat", "web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/voice_assistant/web/static/index.html" = "voice_assistant/web/static/index.html"
"src/voice_assistant/session/schema.sql" = "voice_assistant/session/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
